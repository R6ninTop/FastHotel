# Netlify Configuration for FastHotel Frontend
[build]
  command = "yarn build"
  publish = "build"

[dev]
  command = "yarn start"
  port = 3000

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (you need to set these in Netlify dashboard)
# REACT_APP_API_URL should point to your backend

[context.production.environment]
  REACT_APP_API_URL = "https://seu-backend-url.com/api"

[context.development.environment]
  REACT_APP_API_URL = "http://localhost:5000/api"
